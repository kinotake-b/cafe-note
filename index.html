<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="description" content="行ったカフェと行きたいカフェを、味や値段といっしょに残す個人用カフェ帳">
<title>カフェ帳</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #ffffff; --soft: #f3f4f3; --line: #e2e6e3; --ink: #1f2423; --sub: #667069;
    --accent: #2b6a5c; --tint: #e4efeb;
    --sans: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: light; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 var(--sans); -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--soft); border: 1px solid transparent; border-radius: 12px; padding: 10px 14px; min-height: 46px; }
  textarea { resize: vertical; line-height: 1.7; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); background: var(--bg); }
  ::placeholder { color: #a3aaa6; }
  img { display: block; }

  .page { max-width: 640px; margin: 0 auto; padding: 0 16px 120px; }
  .view { display: none; } .view.on { display: block; }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 8px; }
  h1 { font: 700 26px/1.3 var(--sans); margin: 0; }
  h2.sec { font: 600 18px/1.4 var(--sans); margin: 28px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .sm { font-size: 13px; color: var(--sub); }
  .accent { color: var(--accent); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 18px; border-radius: 12px; background: var(--soft); font-weight: 600; transition: transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.line { background: var(--bg); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .btn.text { background: none; color: var(--sub); font-weight: 500; padding: 0 8px; }
  .btn.danger { background: none; color: #b3261e; font-weight: 500; }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
  .btn.block { width: 100%; }
  .row { display: flex; gap: 8px; margin-top: 10px; } .row > * { flex: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* 検索・絞り込み */
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .filters .wide { grid-column: 1 / -1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { padding: 4px 12px; min-height: 32px; border-radius: 999px; background: var(--soft); font-size: 14px; color: var(--sub); }
  .chip.on { background: var(--accent); color: #fff; }

  /* カード */
  .card { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; }
  .thumb { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--tint); color: var(--accent); display: grid; place-items: center; font: 700 22px var(--sans); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { flex: 1; min-width: 0; }
  .card .name { font: 600 17px/1.4 var(--sans); }
  .card .meta { font-size: 13px; color: var(--sub); }
  .card .memo { font-size: 14px; color: var(--ink); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .price { font-size: 13px; color: var(--accent); font-weight: 600; }
  .stars { color: var(--accent); letter-spacing: 1px; font-size: 15px; }
  .stars .off { color: #d3d8d5; }
  .empty { text-align: center; color: var(--sub); padding: 48px 16px; }
  .empty p { text-wrap: balance; margin: 0; }
  .empty .btn { margin-top: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 12px; margin-top: 16px; }
  .tc { display: block; width: 100%; text-align: left; }
  .tc .ph { aspect-ratio: 1; border-radius: 14px; background: var(--tint); color: var(--accent); overflow: hidden; display: grid; place-items: center; font: 700 48px var(--sans); }
  .tc .ph img { width: 100%; height: 100%; object-fit: cover; }
  .tc .name { font-weight: 700; line-height: 1.4; margin-top: 8px; }
  .tc .meta { font-size: 13px; color: var(--sub); line-height: 1.5; }

  /* 下のメニュー */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
  nav.tabs .in { display: flex; width: 100%; max-width: 640px; }
  nav.tabs button { flex: 1; padding: 8px 0 6px; font-size: 11px; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 0; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button svg.i { margin-bottom: 2px; }
  nav.tabs button.on { color: var(--accent); font-weight: 700; }
  .fab { position: fixed; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 30px; line-height: 1; box-shadow: 0 4px 14px rgba(20,50,45,.3); z-index: 21; display: grid; place-items: center; }

  /* 画面いっぱいのシート */
  .sheet { position: fixed; inset: 0; background: var(--bg); z-index: 50; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet .page { padding-bottom: 60px; }
  .sheet .bar { position: sticky; top: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); z-index: 2; }
  .sheet .bar .in { max-width: 640px; margin: 0 auto; padding: 8px 8px; display: flex; justify-content: space-between; align-items: center; }
  .bar .ttl { font: 600 17px var(--sans); }

  /* フォーム */
  label.f { display: block; font-size: 13px; color: var(--sub); font-weight: 600; margin: 16px 0 6px; }
  .seg { display: flex; background: var(--soft); border-radius: 12px; padding: 3px; }
  .seg button { flex: 1; min-height: 40px; border-radius: 10px; font-weight: 600; color: var(--sub); }
  .seg.k4 button { font-size: 12px; padding: 0 1px; white-space: nowrap; }
  .seg button.on { background: var(--bg); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .starin { display: flex; gap: 4px; }
  .starin button { font-size: 34px; line-height: 1; color: #d3d8d5; padding: 2px 4px; }
  .starin button.on { color: var(--accent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .order { display: grid; grid-template-columns: 1fr 96px 40px; gap: 6px; margin-bottom: 6px; }
  .order button { color: var(--sub); font-size: 20px; }
  .slider { display: grid; grid-template-columns: 52px 1fr 20px; align-items: center; gap: 8px; font-size: 14px; }
  .slider input { padding: 0; min-height: 32px; background: none; accent-color: var(--accent); }
  .photoin { width: 100%; aspect-ratio: 16/10; border-radius: 16px; background: var(--soft); display: grid; place-items: center; color: var(--sub); overflow: hidden; position: relative; }
  .photoin img { width: 100%; height: 100%; object-fit: cover; }

  /* 詳細 */
  .hero { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 16px; margin-top: 12px; }
  .kv { display: grid; grid-template-columns: 88px 1fr; gap: 6px 10px; margin: 14px 0; font-size: 15px; }
  .kv dt { color: var(--sub); font-size: 13px; padding-top: 2px; } .kv dd { margin: 0; }
  .tag { display: inline-block; background: var(--tint); color: var(--accent); border-radius: 999px; padding: 1px 10px; font-size: 13px; margin: 0 4px 4px 0; }
  .tastebar { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px; }
  .tastebar .tr { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; } .tastebar .tr i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

  /* 地図 */
  #map { height: calc(100vh - 220px); min-height: 320px; border-radius: 16px; overflow: hidden; margin-top: 8px; background: var(--soft); }

  /* 統計 */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .tile { background: var(--soft); border-radius: 16px; padding: 14px; }
  .tile b { display: block; font: 600 26px/1.3 var(--sans); } .tile span { font-size: 13px; color: var(--sub); }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; margin-top: 8px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 11px; color: var(--sub); }
  .bars .b i { display: block; width: 100%; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 2px; }
  .hbar { display: grid; grid-template-columns: 96px 1fr 36px; align-items: center; gap: 8px; font-size: 14px; margin: 6px 0; }
  .hbar .tr { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; } .hbar .tr i { display: block; height: 100%; background: var(--accent); }
  .hbar span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .hbar span:last-child { text-align: right; color: var(--sub); }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #1f2423; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 100; max-width: 90%; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M6.5 4h11v16.5l-5.5-4-5.5 4z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-bars" viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</defs></svg>

<div class="page">
  <!-- 記録 -->
  <section class="view on" id="v-list">
    <div class="head"><h1>カフェ帳</h1><span class="sm" id="listCount"></span></div>
    <input id="q" type="search" placeholder="店名・エリア・飲み物・メモで探す">
    <div class="filters">
      <select id="fRate"><option value="0">評価: すべて</option><option value="5">★5だけ</option><option value="4">★4以上</option><option value="3">★3以上</option></select>
      <select id="fSort"><option value="new">新しい順</option><option value="old">古い順</option><option value="rate">評価が高い順</option><option value="name">店名順</option></select>
    </div>
    <div class="chips" id="tagChips"></div>
    <div id="list"></div>
  </section>

  <!-- 行きたい -->
  <section class="view" id="v-want">
    <div class="head"><h1>行きたい</h1><span class="sm" id="wantCount"></span></div>
    <div id="wantList"></div>
  </section>

  <!-- 地図 -->
  <section class="view" id="v-map">
    <div class="head"><h1>地図</h1><span class="sm" id="mapNote"></span></div>
    <div id="map"></div>
    <p class="sm">茶色の丸=行った店、灰色の丸=行きたい店。位置は店を登録するときに「住所から探す」か「現在地」で入れます。</p>
  </section>

  <!-- 統計 -->
  <section class="view" id="v-stats">
    <div class="head"><h1>統計</h1></div>
    <div id="stats"></div>
    <h2 class="sec">データの保管</h2>
    <p class="sm">記録はこの端末のブラウザの中にだけ保存されます。機種変更やブラウザのデータ消去に備えて、ときどき書き出してください。</p>
    <div class="row">
      <button class="btn line" id="btnExport">書き出す</button>
      <button class="btn line" id="btnImport">読み込む</button>
    </div>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </section>
</div>

<button class="fab" id="fab" aria-label="カフェを追加"><svg class="i" style="stroke-width:2.2"><use href="#i-plus"/></svg></button>

<nav class="tabs"><div class="in">
  <button data-tab="list" class="on"><svg class="i"><use href="#i-list"/></svg>記録</button>
  <button data-tab="want"><svg class="i"><use href="#i-mark"/></svg>行きたい</button>
  <button data-tab="map"><svg class="i"><use href="#i-pin"/></svg>地図</button>
  <button data-tab="stats"><svg class="i"><use href="#i-bars"/></svg>統計</button>
</div></nav>

<!-- 詳細 -->
<div class="sheet" id="detail" hidden></div>

<!-- 編集 -->
<div class="sheet" id="editor" hidden>
  <div class="bar"><div class="in">
    <button class="btn text" id="edCancel">閉じる</button>
    <span class="ttl" id="edTitle">カフェを記録</span>
    <button class="btn primary small" id="edSave">保存</button>
  </div></div>
  <div class="page">
    <div class="seg" style="margin-top:16px">
      <button data-status="visited" class="on">行った</button>
      <button data-status="want">行きたい</button>
    </div>

    <label class="f">店名 *</label>
    <input id="fName" placeholder="例: ○○珈琲店">
    <div class="two">
      <div><label class="f">エリア</label><input id="fArea" placeholder="例: 下北沢"></div>
      <div><label class="f" id="fDateLbl">訪問日</label><input id="fDate" type="date"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn line small" id="btnGeo">住所から位置を探す</button>
      <button class="btn line small" id="btnHere">現在地を使う</button>
    </div>
    <div class="sm" id="geoState" style="margin-top:6px"></div>

    <div class="only-visited">
      <label class="f">評価</label>
      <div class="starin" id="starIn"></div>

      <label class="f">注文したもの(名前と値段)</label>
      <div id="orders"></div>
      <button class="btn line small" id="addOrder">＋ 注文を足す</button>
      <div class="sm" style="margin-top:6px">合計: <b id="orderTotal">0</b> 円</div>

      <h2 class="sec">コーヒーのこと</h2>
      <label class="f">種類(選ぶと、その種類に合う項目だけが出ます)</label>
      <div class="seg k4" id="kindSeg">
        <button type="button" data-kind="espresso">エスプレッソ</button><button type="button" data-kind="drip">ドリップ</button><button type="button" data-kind="milk">ミルク系</button><button type="button" data-kind="other">その他</button>
      </div>
      <label class="f">飲み物</label>
      <input id="fDrink" list="drinkList" placeholder="例: ハンドドリップ(ブレンド)">
      <datalist id="drinkList"></datalist>
      <div id="beansWrap"><label class="f">豆・産地</label><input id="fBeans" placeholder="例: エチオピア イルガチェフェ"></div>
      <div class="two">
        <div id="roastWrap"><label class="f">焙煎度</label>
          <select id="fRoast"><option value="">未入力</option><option>浅煎り</option><option>中煎り</option><option>中深煎り</option><option>深煎り</option></select></div>
        <div><label class="f">温度</label>
          <select id="fTemp"><option value="">未入力</option><option>ホット</option><option>アイス</option></select></div>
      </div>
      <label class="f">味の印象</label>
      <div class="slider" id="rowAcid"><span>酸味</span><input type="range" id="tAcid" min="0" max="5" value="0"><b id="tAcidV">–</b></div>
      <div class="slider"><span>苦味</span><input type="range" id="tBitter" min="0" max="5" value="0"><b id="tBitterV">–</b></div>
      <div class="slider"><span>甘み</span><input type="range" id="tSweet" min="0" max="5" value="0"><b id="tSweetV">–</b></div>
      <div class="sm">0のままなら「未入力」として扱います。</div>

      <h2 class="sec">お店のこと</h2>
      <label class="f">タグ</label>
      <div class="chips" id="tagPick"></div>
      <div class="row"><input id="newTag" placeholder="タグを足す(例: 猫がいる)"><button class="btn small" id="btnNewTag" style="flex:none">追加</button></div>
    </div>

    <label class="f" id="fMemoLbl">メモ</label>
    <textarea id="fMemo" rows="4" placeholder="感想、また頼みたいもの、気づいたこと"></textarea>

    <label class="f">写真</label>
    <label class="photoin" id="photoBox"><span id="photoHint">タップして写真を選ぶ</span><input type="file" id="fPhoto" accept="image/*" hidden></label>
    <div class="row"><button class="btn text" id="btnPhotoDel" hidden>写真を外す</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'cafe-note-v1';
  var KINDS = {
    espresso: { label: 'エスプレッソ', drinks: ['エスプレッソ', 'アメリカーノ', 'ドッピオ', 'リストレット'], beans: true, acid: true },
    drip: { label: 'ドリップ', drinks: ['ハンドドリップ', 'エアロプレス', 'サイフォン', '水出しコーヒー'], beans: true, acid: true },
    milk: { label: 'ミルク系', drinks: ['カフェラテ', 'カプチーノ', 'フラットホワイト', 'カフェモカ', 'マキアート'], beans: false, acid: false },
    other: { label: 'その他', drinks: ['アイスコーヒー', 'ブレンドコーヒー', '紅茶', 'ジュース'], beans: true, acid: true }
  };
  var PRESET_TAGS = ['作業向き', '電源あり', 'Wi-Fi', '静か', '自家焙煎', 'スイーツ◎', 'ひとりOK', '夜まで', 'テラス', '席が多い'];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var yen = function (n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); };
  var today = function () { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  /* ---------- データ ---------- */
  var items = [];
  var customTags = [];
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); items = d.items || []; customTags = d.customTags || []; }
    } catch (e) { items = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ items: items, customTags: customTags })); return true; }
    catch (e) { toast('保存できませんでした。写真が多すぎるかもしれません。書き出してから整理してください。'); return false; }
  }
  var toastTimer;
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.remove(); }, 2600);
  }
  function total(it) { return (it.orders || []).reduce(function (s, o) { return s + (Number(o.p) || 0); }, 0); }
  function allTags() {
    var set = PRESET_TAGS.concat(customTags);
    items.forEach(function (it) { (it.tags || []).forEach(function (t) { if (set.indexOf(t) < 0) set.push(t); }); });
    return set;
  }
  function starsHtml(n) {
    var s = ''; for (var i = 1; i <= 5; i++) s += i <= n ? '★' : '<span class="off">★</span>';
    return '<span class="stars">' + s + '</span>';
  }

  /* ---------- 画面切り替え ---------- */
  var tab = 'list';
  function setTab(t) {
    tab = t;
    ['list', 'want', 'map', 'stats'].forEach(function (k) { $('v-' + k).classList.toggle('on', k === t); });
    document.querySelectorAll('nav.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === t); });
    $('fab').hidden = (t === 'map' || t === 'stats');
    render(); window.scrollTo(0, 0);
  }
  document.querySelector('nav.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab);
  });

  /* ---------- 一覧 ---------- */
  var tagFilter = '';
  function initial(it) { return esc(Array.from(it.name)[0] || '?'); }
  function shortDate(d) { if (!d) return ''; return d.slice(0, 4) === today().slice(0, 4) ? d.slice(5).replace('-', '/') : d.replace(/-/g, '/'); }
  function tileHtml(it) {
    var meta = [it.area, shortDate(it.date)].filter(Boolean).map(esc).join(' ・ ');
    var sub = [it.drink ? esc(it.drink) : '', total(it) ? yen(total(it)) : ''].filter(Boolean).join(' ・ ');

    return rows.map(function (r) { return '<div class="hbar"><span>' + esc(r[0]) + '</span><div class="tr"><i style="width:' + (max ? r[1] / max * 100 : 0) + '%"></i></div><span>' + r[1] + (unit || '') + '</span></div>'; }).join('');
  }
  function countBy(arr, fn) {

  function renderStats() {

    var rated = v.filter(function (i) { return i.rating; });
    var avg = rated.length ? (rated.reduce(function (s, i) { return s + i.rating; }, 0) / rated.length).toFixed(1) : '–';
    var ym = today().slice(0, 7);
    var spendAll = v.reduce(function (s, i) { return s + total(i); }, 0);
    var spendMonth = v.filter(function (i) { return (i.date || '').slice(0, 7) === ym; }).reduce(function (s, i) { return s + total(i); }, 0);
    var paid = v.filter(function (i) { return total(i) > 0; });
    var perVisit = paid.length ? spendAll / paid.length : 0;
    var h = '<div class="tiles">' +
      '<div class="tile"><b>' + v.length + '</b><span>行った回数</span></div>' +
      '<div class="tile"><b>' + avg + '</b><span>平均の評価</span></div>' +
      '<div class="tile"><b>' + yen(spendMonth) + '</b><span>今月の支出</span></div>' +
      '<div class="tile"><b>' + (perVisit ? yen(perVisit) : '–') + '</b><span>1回あたりの平均</span></div></div>';
    // 直近6か月の支出
    var months = [], d = new Date(); d.setDate(1);
    for (var i = 5; i >= 0; i--) { var x = new Date(d.getFullYear(), d.getMonth() - i, 1); months.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); }
    var sums = months.map(function (m) { return v.filter(function (it) { return (it.date || '').slice(0, 7) === m; }).reduce(function (s, it) { return s + total(it); }, 0); });
    var mx = Math.max.apply(null, sums.concat([1]));
    h += '<h2 class="sec">月ごとの支出(直近6か月)</h2><div class="bars">' + months.map(function (m, k) {
      return '<div class="b"><span>' + (sums[k] ? yen(sums[k]) : '') + '</span><i style="height:' + Math.round(sums[k] / mx * 100) + '%"></i><span>' + Number(m.slice(5)) + '月</span></div>';
    }).join('') + '</div>';
    h += '<h2 class="sec">よく行くエリア</h2>' + hbars(countBy(v, function (i) { return i.area; }).slice(0, 5), '回');
    h += '<h2 class="sec">よく頼む飲み物</h2>' + hbars(countBy(v, function (i) { return i.drink; }).slice(0, 5), '回');
    h += '<h2 class="sec">焙煎度の好み</h2>' + hbars(countBy(v, function (i) { return i.roast; }), '回');
    h += '<h2 class="sec">評価の内訳</h2>' + hbars([5, 4, 3, 2, 1].map(function (n) { return ['★' + n, v.filter(function (i) { return i.rating === n; }).length]; }), '件');
    var tasted = v.filter(function (i) { return i.taste && (i.taste.acid || i.taste.bitter || i.taste.sweet); });
    if (tasted.length) {
      var av = function (k) { var a = tasted.filter(function (i) { return i.taste[k]; }); return a.length ? a.reduce(function (s, i) { return s + i.taste[k]; }, 0) / a.length : 0; };
      h += '<h2 class="sec">味の傾向(平均)</h2>' + [['酸味', av('acid')], ['苦味', av('bitter')], ['甘み', av('sweet')]].map(function (p) {
        return '<div class="tastebar"><span>' + p[0] + '</span><div class="tr"><i style="width:' + p[1] * 20 + '%"></i></div></div>';
      }).join('');
    }
    h += '<h2 class="sec">よく付けるタグ</h2>' + hbars(countBy([].concat.apply([], v.map(function (i) { return i.tags || []; })), function (t) { return t; }).slice(0, 5), '件');
    $('stats').innerHTML = h;
  }

  /* ---------- 書き出し・読み込み ---------- */
  $('btnExport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify({ app: 'cafe-note', version: 1, exported: new Date().toISOString(), items: items, customTags: customTags }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cafe-note-' + today() + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  $('btnImport').addEventListener('click', function () { $('fileImport').click(); });
  $('fileImport').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || d.app !== 'cafe-note' || !Array.isArray(d.items)) throw new Error('形式');
        var ids = {}; items.forEach(function (i) { ids[i.id] = 1; });
        var add = d.items.filter(function (i) { return i && i.id && i.name && !ids[i.id]; });
        if (!confirm(add.length + '件を追加します(すでにある記録は上書きしません)。よろしいですか?')) return;
        items = items.concat(add);
        (d.customTags || []).forEach(function (t) { if (customTags.indexOf(t) < 0) customTags.push(t); });
        save(); render(); toast(add.length + '件を読み込みました');
      } catch (err) { toast('このファイルは読み込めませんでした'); }
      $('fileImport').value = '';
    };
    r.readAsText(f);
  });

  function render() {
    if (tab === 'list') renderList(); else if (tab === 'want') renderWant(); else if (tab === 'map') renderMap(); else if (tab === 'stats') renderStats();
  }
  load(); setTab('list');
})();
</script>
</body>
</html>
